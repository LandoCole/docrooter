[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docrooter"
version = "0.1.0.dev0"
description = "Document TOC extraction and taxonomy-based section classification."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "table of contents",
    "document structure",
    "taxonomy",
    "text classification",
    "hierarchical classification",
    "zero-shot",
    "embeddings",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
dependencies = [
    "pydantic>=2",
    "numpy",
    "typer",
    "rich",
]

[project.optional-dependencies]
models = [
    "torch",
    "transformers>=5",
    "sentence-transformers>=6",
    "scikit-learn",
    "joblib",
    "datasets",
]
pdf = ["pymupdf4llm"]
pdf-mit = ["pdfplumber"]
llm = ["httpx"]
jev = ["typesafe-sdk>=0.7.5"]
bench = ["datasets", "pandas"]
ui = ["fastapi", "uvicorn", "python-multipart"]
all = ["docrooter[models,pdf,pdf-mit,llm,jev,ui]"]

[project.urls]
# Placeholder: replace with the real repository before the first release.
Homepage = "https://github.com/docrooter/docrooter"
Documentation = "https://github.com/docrooter/docrooter#readme"
Repository = "https://github.com/docrooter/docrooter"
Issues = "https://github.com/docrooter/docrooter/issues"

[project.scripts]
docrooter = "docrooter.cli:app"

[dependency-groups]
dev = ["pyinstrument>=5.1", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/docrooter"]

[tool.hatch.build.targets.sdist]
# benchmarks/ and the tests that import it stay out of the source distribution
include = [
    "/src",
    "/examples",
    "/docs/taxonomy-formats.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["models: downloads and runs ML models"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
