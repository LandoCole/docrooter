name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install "$UV_PYTHON"
      - run: uv sync --locked --extra pdf --extra pdf-mit --extra ui --extra llm
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release tag matches the package version
        # A v0.3.0 release must not upload code labelled 0.2.0 (or the reverse).
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/docrooter/__init__.py)
          if [ -z "$version" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match the package version (expected v$version)"
            exit 1
          fi
          echo "release tag $GITHUB_REF_NAME matches docrooter $version"
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: no API token is stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
