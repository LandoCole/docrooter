name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }} # beats the repository's .python-version for every uv command
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.python-version }}
      - name: Set up Python
        run: uv python install "$UV_PYTHON"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest

  # The core install above has no optional extras, so the PDF, playground and LLM tests skip.
  # This job installs those extras (but not torch, which the unit tests must never need) so they run,
  # and measures coverage: the PDF package cannot reach its target without PyMuPDF.
  extras-smoke:
    name: Extras smoke (pdf, pdf-mit, ui, llm)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: extras
      - name: Set up Python
        run: uv python install "$UV_PYTHON"
      - run: uv sync --locked --extra pdf --extra pdf-mit --extra ui --extra llm
      - name: Test with coverage
        run: uv run --no-sync pytest --cov=docrooter --cov-report=term --cov-report=xml
      # Line coverage must stay at or above 80% in each of the core packages (the overall figure
      # is reported, not gated). Every package is reported, in the log and the job summary,
      # before the step fails on the ones under the bar.
      - name: Coverage gate
        run: |
          failed=""
          for target in document taxonomy classify pdf views.py; do
            case "$target" in
              *.py) include="src/docrooter/$target" ;;
              *) include="src/docrooter/$target/*" ;;
            esac
            echo "### docrooter/$target" >> "$GITHUB_STEP_SUMMARY"
            uv run --no-sync coverage report --include="$include" --format=markdown >> "$GITHUB_STEP_SUMMARY"
            if ! uv run --no-sync coverage report --include="$include" --fail-under=80; then
              failed="$failed docrooter/$target"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::line coverage under 80% in:$failed"
            exit 1
          fi
