[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docrooter"
dynamic = ["version"]
description = "Document TOC extraction and taxonomy-based section classification."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "table of contents",
    "document structure",
    "taxonomy",
    "text classification",
    "hierarchical classification",
    "zero-shot",
    "embeddings",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
dependencies = [
    "pydantic>=2",
    "numpy",
    "typer",
    "rich",
    "tomli>=2; python_version < '3.11'",  # router config files (tomllib from 3.11)
]

[project.optional-dependencies]
models = [
    "torch",
    "transformers>=5",
    "sentence-transformers>=6",
    "scikit-learn",
    "joblib",
    "datasets",
]
pdf = ["pymupdf4llm"]
pdf-mit = ["pdfplumber"]
llm = ["httpx"]
jev = ["typesafe-sdk>=0.7.5"]
bench = ["datasets", "pandas"]
# fastapi 0.100: the first with pydantic 2 (Starlette 0.27 has form(max_files, max_fields));
# uvicorn 0.22: timeout_graceful_shutdown; python-multipart 0.0.13: the python_multipart name.
ui = ["fastapi>=0.100", "uvicorn>=0.22", "python-multipart>=0.0.13"]
# OCR: RapidOCR on onnxruntime (pip-only), pages rendered by pypdfium2 when pymupdf is absent.
# Tesseract needs no extra: docrooter calls the system binary.
ocr = ["rapidocr>=3.0", "onnxruntime>=1.18", "pypdfium2>=4.30"]
ocr-mac = ["ocrmac>=1.0; sys_platform == 'darwin'"]
# Layout model: Docling's heron (Apache-2.0) as ONNX on onnxruntime, weights fetched by
# huggingface_hub at a pinned revision, pages rendered by pypdfium2 when pymupdf is absent.
layout = ["onnxruntime>=1.18", "pypdfium2>=4.30", "huggingface_hub>=0.23"]
all = ["docrooter[models,pdf,pdf-mit,llm,jev,ui,ocr,ocr-mac,layout]"]

[project.urls]
# Placeholder: replace with the real repository before the first release.
Homepage = "https://github.com/docrooter/docrooter"
Documentation = "https://github.com/docrooter/docrooter#readme"
Repository = "https://github.com/docrooter/docrooter"
Issues = "https://github.com/docrooter/docrooter/issues"

[project.scripts]
docrooter = "docrooter.cli:app"

[dependency-groups]
dev = [
    "httpx",  # Starlette's TestClient, for the playground tests
    "mkdocs-material",
    "mkdocstrings[python]",
    "mypy",
    "pyinstrument>=5.1",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.version]
# The single source of the version; `docrooter.__version__` is the string in this file.
path = "src/docrooter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/docrooter"]

[tool.hatch.build.targets.sdist]
# benchmarks/ and the tests that import it stay out of the source distribution
include = [
    "/src",
    "/examples",
    "/docs/taxonomy-formats.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "models: downloads and runs ML models",
    "ocr: runs real OCR engines (rapidocr, ocrmac, tesseract)",
    "layout: runs the heron layout model (onnxruntime, downloads its weights)",
]
addopts = "-m 'not models and not ocr and not layout'"
filterwarnings = [
    # PyMuPDF's SWIG bindings; nothing docrooter can fix.
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    # Starlette's TestClient prefers httpx2; the `ui` extra pins neither, so tests use httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
# Design documents hold sketches (ruff 0.17 formats Python fences in Markdown), not code to check.
extend-exclude = ["docs/superpowers"]
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/docrooter"]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The optional extras are not installed in the core CI job, and several ship without type
# information; their imports are lazy (see docrooter._extras), so treat them as Any rather than
# fail on a missing module. Everything in src/docrooter itself is checked.
[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "sklearn",
    "sklearn.*",
    "joblib",
    "datasets",
    "datasets.*",
    "pandas",
    "pandas.*",
    "pymupdf",
    "fitz",
    "pymupdf4llm",
    "pdfplumber",
    "pdfplumber.*",
    "httpx",
    "typesafe",
    "typesafe.*",
    "typesafe_sdk",
    "typesafe_sdk.*",
    "fastapi",
    "fastapi.*",
    "starlette",
    "starlette.*",
    "uvicorn",
    "uvicorn.*",
    "multipart",
    "multipart.*",
    "onnxruntime",
    "onnxruntime.*",
    "rapidocr",
    "rapidocr.*",
    "ocrmac",
    "ocrmac.*",
    "pypdfium2",
    "pypdfium2.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "tomli",
]
ignore_missing_imports = true
